services:
  # 1. 仓配订单汇总核心业务后台 (5大业务计算引擎 + Web网页端 + REST API)
  excel-bot:
    build: .
    container_name: excel-bot-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    volumes:
      # 跨容器共享会话与生成文件缓存
      - shared-sessions:/tmp/excel-bot-sessions
      # 业务预设配置（支持宿主机热重载）
      - ./product-preset.json:/app/product-preset.json
      - ./warehouse-preset.json:/app/warehouse-preset.json
    networks:
      - bot-net

  # 2. AstrBot 全能智能聊天机器人 (统一接入 QQ、微信、大模型智谱 GLM-4-Flash 与专属仓配插件)
  astrbot:
    image: soulter/astrbot:latest
    container_name: astrbot-server
    restart: always
    ports:
      # AstrBot WebUI 统一控制台（可视化配置 QQ官方机器人/个人号、微信、大模型）
      - "6185:6185"
    environment:
      - TZ=Asia/Shanghai
      - EXCEL_BOT_URL=http://excel-bot:3000
      - EXCEL_BOT_SHARED_DIR=/tmp/excel-bot-sessions
    volumes:
      # AstrBot 数据持久化
      - ./astrbot-data:/AstrBot/data
      # 挂载专属仓配插件目录
      - ./astrbot_plugins:/AstrBot/data/plugins
      # 与后台共享文件目录
      - shared-sessions:/tmp/excel-bot-sessions
    networks:
      - bot-net
    depends_on:
      - excel-bot

volumes:
  shared-sessions:

networks:
  bot-net:
    driver: bridge
